<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760"
     font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6068"/>
    </marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3A6EA5"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F8A5B"/>
    </marker>
    <marker id="arrowC" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8E5E8A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>

  <!-- ============================ panel a ============================ -->
  <text x="20" y="32" font-size="15" font-weight="bold" fill="#1A1A1A">a</text>
  <text x="40" y="32" font-size="15" fill="#1A1A1A">
    Multi-time latent spaces with per-group encoders
  </text>
  <text x="40" y="50" font-size="11" fill="#5A6068">
    One encoder tower per group, fed only by its own streams; groups exchange information at two
    explicit points
  </text>

  <!-- input streams -->
  <rect x="20" y="92" width="104" height="58" rx="6" fill="#D6E4F0" stroke="#3A6EA5"/>
  <text x="72" y="116" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F3F63">ERA5</text>
  <text x="72" y="133" font-size="9.5" font-style="italic" text-anchor="middle" fill="#3A6EA5">atmosphere</text>

  <rect x="20" y="256" width="104" height="58" rx="6" fill="#D8EADD" stroke="#3F8A5B"/>
  <text x="72" y="280" font-size="12" font-weight="bold" text-anchor="middle" fill="#21503A">C-GLORS</text>
  <text x="72" y="297" font-size="9.5" font-style="italic" text-anchor="middle" fill="#3F8A5B">ocean</text>

  <line x1="126" y1="121" x2="150" y2="121" stroke="#3A6EA5" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <line x1="126" y1="285" x2="150" y2="285" stroke="#3F8A5B" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- per-group encoders -->
  <rect x="154" y="72" width="186" height="120" rx="6" fill="#EDEFF2" stroke="#3A6EA5" stroke-width="1.8"/>
  <text x="247" y="90" font-size="11" font-weight="bold" text-anchor="middle" fill="#1F3F63">
    Encoder — atmosphere
  </text>
  <text x="166" y="108" font-size="9.5" fill="#3A3F45">stream embedding</text>
  <text x="166" y="124" font-size="9.5" fill="#3A3F45">local assimilation</text>
  <text x="166" y="140" font-size="9.5" fill="#3A3F45">local → global adapter</text>
  <text x="166" y="156" font-size="9.5" fill="#3A3F45">query aggregation</text>
  <text x="166" y="172" font-size="9.5" fill="#3A3F45">global assimilation</text>
  <text x="330" y="186" font-size="9" text-anchor="end" fill="#3A6EA5">own weights</text>

  <rect x="154" y="236" width="186" height="120" rx="6" fill="#EDEFF2" stroke="#3F8A5B" stroke-width="1.8"/>
  <text x="247" y="254" font-size="11" font-weight="bold" text-anchor="middle" fill="#21503A">
    Encoder — ocean
  </text>
  <text x="166" y="272" font-size="9.5" fill="#3A3F45">stream embedding</text>
  <text x="166" y="288" font-size="9.5" fill="#3A3F45">local assimilation</text>
  <text x="166" y="304" font-size="9.5" fill="#3A3F45">local → global adapter</text>
  <text x="166" y="320" font-size="9.5" fill="#3A3F45">query aggregation</text>
  <text x="166" y="336" font-size="9.5" fill="#3A3F45">global assimilation</text>
  <text x="330" y="350" font-size="9" text-anchor="end" fill="#3F8A5B">own weights</text>

  <text x="247" y="212" font-size="9.5" font-style="italic" text-anchor="middle" fill="#8E5E8A">
    no shared parameters, no shared streams
  </text>

  <path d="M 342 132 C 356 132, 358 176, 372 176" fill="none" stroke="#3A6EA5" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <path d="M 342 296 C 356 296, 358 252, 372 252" fill="none" stroke="#3F8A5B" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- assimilation coupling (new) -->
  <rect x="376" y="108" width="112" height="212" rx="6" fill="#EADCEA" stroke="#8E5E8A" stroke-width="1.8"/>
  <rect x="376" y="108" width="112" height="20" rx="6" fill="#8E5E8A"/>
  <text x="432" y="123" font-size="9.5" font-weight="bold" text-anchor="middle" fill="#ffffff">NEW</text>
  <text x="432" y="156" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#5E3A5A">Assimilation</text>
  <text x="432" y="172" font-size="11.5" font-weight="bold" text-anchor="middle" fill="#5E3A5A">coupling</text>
  <text x="432" y="196" font-size="10" text-anchor="middle" fill="#5E3A5A">at t = 0</text>
  <text x="432" y="228" font-size="9" font-style="italic" text-anchor="middle" fill="#5A6068">restores the</text>
  <text x="432" y="240" font-size="9" font-style="italic" text-anchor="middle" fill="#5A6068">cross-domain</text>
  <text x="432" y="252" font-size="9" font-style="italic" text-anchor="middle" fill="#5A6068">analysis that</text>
  <text x="432" y="264" font-size="9" font-style="italic" text-anchor="middle" fill="#5A6068">separate encoders</text>
  <text x="432" y="276" font-size="9" font-style="italic" text-anchor="middle" fill="#5A6068">remove</text>

  <line x1="490" y1="214" x2="512" y2="214" stroke="#5A6068" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- latent state -->
  <rect x="516" y="120" width="104" height="188" rx="6" fill="#FBFBFC" stroke="#8A9099" stroke-dasharray="4 3"/>
  <text x="568" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Latent state</text>

  <g stroke="#ffffff" stroke-width="1.5">
    <rect x="532" y="154" width="36" height="24" fill="#D6E4F0"/>
    <rect x="532" y="178" width="36" height="24" fill="#D6E4F0"/>
    <rect x="532" y="202" width="36" height="24" fill="#D6E4F0"/>
    <rect x="532" y="226" width="36" height="24" fill="#D6E4F0"/>
    <rect x="568" y="154" width="36" height="24" fill="#D8EADD"/>
    <rect x="568" y="178" width="36" height="24" fill="#D8EADD"/>
    <rect x="568" y="202" width="36" height="24" fill="#D8EADD"/>
    <rect x="568" y="226" width="36" height="24" fill="#D8EADD"/>
  </g>
  <rect x="532" y="154" width="36" height="96" fill="none" stroke="#3A6EA5" stroke-width="1.6"/>
  <rect x="568" y="154" width="36" height="96" fill="none" stroke="#3F8A5B" stroke-width="1.6"/>
  <text x="550" y="263" font-size="9" text-anchor="middle" fill="#1F3F63">atm</text>
  <text x="586" y="263" font-size="9" text-anchor="middle" fill="#21503A">ocn</text>
  <text x="568" y="284" font-size="8.5" text-anchor="middle" fill="#3A3F45">per-group slice,</text>
  <text x="568" y="296" font-size="8.5" text-anchor="middle" fill="#3A3F45">own D and HEALPix level</text>

  <path d="M 622 186 C 636 186, 638 152, 652 152" fill="none" stroke="#3A6EA5" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <path d="M 622 242 C 636 242, 638 282, 652 282" fill="none" stroke="#3F8A5B" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- per-group forecasting engines -->
  <rect x="656" y="118" width="158" height="68" rx="6" fill="#D6E4F0" stroke="#3A6EA5"/>
  <text x="735" y="136" font-size="9" text-anchor="middle" fill="#3A6EA5">Forecasting engine</text>
  <text x="735" y="154" font-size="12" font-weight="bold" text-anchor="middle" fill="#1F3F63">atmosphere</text>
  <text x="735" y="172" font-size="10" text-anchor="middle" fill="#1F3F63">Δt = 6 h</text>

  <rect x="656" y="248" width="158" height="68" rx="6" fill="#D8EADD" stroke="#3F8A5B"/>
  <text x="735" y="266" font-size="9" text-anchor="middle" fill="#3F8A5B">Forecasting engine</text>
  <text x="735" y="284" font-size="12" font-weight="bold" text-anchor="middle" fill="#21503A">ocean</text>
  <text x="735" y="302" font-size="10" text-anchor="middle" fill="#21503A">Δt = 24 h</text>

  <path d="M 816 152 C 830 152, 832 190, 846 190" fill="none" stroke="#3A6EA5" stroke-width="1.5" marker-end="url(#arrowA)"/>
  <path d="M 816 282 C 830 282, 832 244, 846 244" fill="none" stroke="#3F8A5B" stroke-width="1.5" marker-end="url(#arrowO)"/>

  <!-- rollout coupling -->
  <rect x="850" y="140" width="100" height="154" rx="6" fill="#EADCEA" stroke="#8E5E8A"/>
  <text x="900" y="180" font-size="11" font-weight="bold" text-anchor="middle" fill="#5E3A5A">Rollout</text>
  <text x="900" y="196" font-size="11" font-weight="bold" text-anchor="middle" fill="#5E3A5A">coupling</text>
  <text x="900" y="220" font-size="10" text-anchor="middle" fill="#5E3A5A">every 24 h</text>
  <text x="900" y="248" font-size="8.5" font-style="italic" text-anchor="middle" fill="#5A6068">the only exchange</text>
  <text x="900" y="260" font-size="8.5" font-style="italic" text-anchor="middle" fill="#5A6068">during rollout</text>

  <line x1="952" y1="217" x2="974" y2="217" stroke="#5A6068" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- decoders -->
  <rect x="978" y="120" width="150" height="188" rx="6" fill="#F7F2E8" stroke="#A98B5D"/>
  <text x="1053" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#1A1A1A">
    Per-stream decoders
  </text>
  <rect x="992" y="164" width="122" height="28" rx="4" fill="#D6E4F0" stroke="#3A6EA5"/>
  <text x="1053" y="182" font-size="10" text-anchor="middle" fill="#1F3F63">ERA5 ← atm</text>
  <rect x="992" y="200" width="122" height="28" rx="4" fill="#D8EADD" stroke="#3F8A5B"/>
  <text x="1053" y="218" font-size="10" text-anchor="middle" fill="#21503A">C-GLORS ← ocn</text>
  <text x="1053" y="252" font-size="8.5" text-anchor="middle" fill="#5A6068">1-ring HEALPix gather</text>
  <text x="1053" y="264" font-size="8.5" text-anchor="middle" fill="#5A6068">on the group slice,</text>
  <text x="1053" y="276" font-size="8.5" text-anchor="middle" fill="#5A6068">coordinate-conditioned</text>

  <!-- rollout loop -->
  <path d="M 900 297 C 900 340, 700 344, 700 344 C 600 344, 568 330, 568 312"
        fill="none" stroke="#8E5E8A" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrowC)"/>
  <text x="742" y="360" font-size="9.5" text-anchor="middle" fill="#8E5E8A">next rollout step</text>

  <!-- ============================ panel b ============================ -->
  <line x1="20" y1="404" x2="1160" y2="404" stroke="#DDE0E4" stroke-width="1"/>

  <text x="20" y="438" font-size="15" font-weight="bold" fill="#1A1A1A">b</text>
  <text x="40" y="438" font-size="15" fill="#1A1A1A">Where cross-domain information crosses</text>
  <text x="40" y="456" font-size="11" fill="#5A6068">
    The design trade: continuous implicit mixing is replaced by two explicit, auditable exchanges
  </text>

  <!-- develop row -->
  <text x="176" y="508" font-size="11" font-weight="bold" text-anchor="end" fill="#3A3F45">develop</text>
  <text x="176" y="522" font-size="9" text-anchor="end" fill="#5A6068">one latent</text>
  <rect x="196" y="488" width="470" height="34" rx="4" fill="#EDEFF2" stroke="#8A9099"/>
  <text x="431" y="510" font-size="10.5" text-anchor="middle" fill="#3A3F45">
    shared encoder — every stream mixes with every other, continuously
  </text>
  <rect x="666" y="488" width="360" height="34" rx="4" fill="#FBFBFC" stroke="#C6CAD0" stroke-dasharray="4 3"/>
  <text x="846" y="510" font-size="10.5" text-anchor="middle" fill="#5A6068">
    single engine — no groups to exchange between
  </text>

  <!-- proposed row -->
  <text x="176" y="588" font-size="11" font-weight="bold" text-anchor="end" fill="#5E3A5A">proposed</text>
  <text x="176" y="602" font-size="9" text-anchor="end" fill="#5A6068">per-group towers</text>

  <rect x="196" y="568" width="150" height="34" rx="4" fill="#FBFBFC" stroke="#C6CAD0" stroke-dasharray="4 3"/>
  <text x="271" y="590" font-size="10" text-anchor="middle" fill="#5A6068">encoders: no exchange</text>

  <rect x="352" y="568" width="128" height="34" rx="4" fill="#EADCEA" stroke="#8E5E8A" stroke-width="1.6"/>
  <text x="416" y="584" font-size="10" font-weight="bold" text-anchor="middle" fill="#5E3A5A">assimilation</text>
  <text x="416" y="596" font-size="9" text-anchor="middle" fill="#5E3A5A">coupling · t = 0</text>

  <rect x="486" y="568" width="180" height="34" rx="4" fill="#FBFBFC" stroke="#C6CAD0" stroke-dasharray="4 3"/>
  <text x="576" y="590" font-size="10" text-anchor="middle" fill="#5A6068">steps 1–3: no exchange</text>

  <rect x="672" y="568" width="128" height="34" rx="4" fill="#EADCEA" stroke="#8E5E8A" stroke-width="1.6"/>
  <text x="736" y="584" font-size="10" font-weight="bold" text-anchor="middle" fill="#5E3A5A">rollout</text>
  <text x="736" y="596" font-size="9" text-anchor="middle" fill="#5E3A5A">coupling · +24 h</text>

  <rect x="806" y="568" width="220" height="34" rx="4" fill="#FBFBFC" stroke="#C6CAD0" stroke-dasharray="4 3"/>
  <text x="916" y="590" font-size="10" text-anchor="middle" fill="#5A6068">steps 5–7: no exchange …</text>

  <!-- consequences -->
  <text x="196" y="648" font-size="10.5" font-weight="bold" fill="#21503A">What this buys</text>
  <text x="196" y="666" font-size="9.5" fill="#3A3F45">· per-group HEALPix level and embedding width become possible</text>
  <text x="196" y="682" font-size="9.5" fill="#3A3F45">· a group can be pretrained, frozen or replaced on its own</text>
  <text x="196" y="698" font-size="9.5" fill="#3A3F45">· a new Earth-system component is an added tower, not a retrain</text>
  <text x="196" y="714" font-size="9.5" fill="#3A3F45">· the coupling is an explicit object that can be measured and ablated</text>

  <text x="666" y="648" font-size="10.5" font-weight="bold" fill="#8B3A3A">What it costs</text>
  <text x="666" y="666" font-size="9.5" fill="#3A3F45">· encoder parameters scale with the number of groups</text>
  <text x="666" y="682" font-size="9.5" fill="#3A3F45">· every stream must belong to exactly one group</text>
  <text x="666" y="698" font-size="9.5" fill="#3A3F45">· cross-domain analysis rests entirely on one coupling block</text>
  <text x="666" y="714" font-size="9.5" fill="#3A3F45">· an empty group must still emit a well-formed latent</text>
</svg>
