<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 810" width="1500" height="810"
     font-family="Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6068"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1500" height="810" fill="#ffffff"/>

  <!-- ============================ panel a ============================ -->
  <text x="20" y="36" font-size="17" font-weight="bold" fill="#1A1A1A">a</text>
  <text x="44" y="36" font-size="17" fill="#1A1A1A">
    WeatherGenerator with a single latent space
  </text>
  <text x="44" y="58" font-size="12.5" fill="#5A6068">
    Per-stream embedding and decoding around a shared assimilation trunk, one forecasting engine
    for the whole latent
  </text>

  <!-- input streams, one box per stream -->
  <rect x="20" y="96" width="150" height="100" rx="6" fill="#F2F3F5" stroke="#8A9099"/>
  <text x="95" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">
    ERA5
  </text>
  <text x="95" y="150" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5A6068">
    atmosphere
  </text>
  <text x="95" y="174" font-size="11" text-anchor="middle" fill="#5A6068">token_size 8</text>

  <rect x="20" y="204" width="150" height="100" rx="6" fill="#F2F3F5" stroke="#8A9099"/>
  <text x="95" y="234" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">
    C-GLORS
  </text>
  <text x="95" y="258" font-size="11.5" font-style="italic" text-anchor="middle" fill="#5A6068">
    ocean
  </text>
  <text x="95" y="282" font-size="11" text-anchor="middle" fill="#5A6068">token_size 8</text>

  <line x1="170" y1="146" x2="196" y2="146" stroke="#5A6068" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <line x1="170" y1="254" x2="196" y2="254" stroke="#5A6068" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <!-- stream embedding, outside the encoder -->
  <rect x="200" y="96" width="162" height="100" rx="6" fill="#EDEFF2" stroke="#8A9099"/>
  <text x="281" y="122" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">
    Stream embedding
  </text>
  <text x="281" y="144" font-size="11" text-anchor="middle" fill="#3A3F45">
    transformer, 2 blocks
  </text>
  <text x="281" y="164" font-size="11" text-anchor="middle" fill="#3A3F45">8 heads · dim 256</text>
  <text x="281" y="186" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5A6068">
    → ae_local_dim_embed
  </text>

  <rect x="200" y="204" width="162" height="100" rx="6" fill="#EDEFF2" stroke="#8A9099"/>
  <text x="281" y="230" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#1A1A1A">
    Stream embedding
  </text>
  <text x="281" y="252" font-size="11" text-anchor="middle" fill="#3A3F45">
    transformer, 2 blocks
  </text>
  <text x="281" y="272" font-size="11" text-anchor="middle" fill="#3A3F45">8 heads · dim 256</text>
  <text x="281" y="294" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5A6068">
    → ae_local_dim_embed
  </text>

  <!-- the two embedded streams converge on the shared trunk -->
  <path d="M 362 146 C 378 146, 380 196, 388 196" fill="none" stroke="#5A6068" stroke-width="1.5"
        marker-end="url(#arrow)"/>
  <path d="M 362 254 C 378 254, 380 196, 388 196" fill="none" stroke="#5A6068" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <!-- shared encoder trunk -->
  <rect x="392" y="80" width="244" height="232" rx="6" fill="#EDEFF2" stroke="#8A9099"/>
  <text x="514" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">
    Shared encoder
  </text>
  <text x="514" y="128" font-size="11" font-style="italic" text-anchor="middle" fill="#5A6068">
    all streams, one trunk
  </text>
  <text x="412" y="162" font-size="12.5" fill="#3A3F45">local assimilation (per cell)</text>
  <text x="412" y="188" font-size="12.5" fill="#3A3F45">local → global adapter</text>
  <text x="412" y="214" font-size="12.5" fill="#3A3F45">query aggregation</text>
  <text x="412" y="240" font-size="12.5" fill="#3A3F45">global assimilation</text>
  <text x="514" y="274" font-size="11" font-style="italic" text-anchor="middle" fill="#5A6068">
    all streams write to the same
  </text>
  <text x="514" y="292" font-size="11" font-style="italic" text-anchor="middle" fill="#5A6068">
    set of learned queries
  </text>

  <line x1="636" y1="196" x2="662" y2="196" stroke="#5A6068" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <!-- latent state: one untyped query slice -->
  <rect x="666" y="80" width="190" height="232" rx="6" fill="#FBFBFC" stroke="#8A9099"
        stroke-dasharray="4 3"/>
  <text x="761" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">
    Latent state
  </text>

  <!-- auxiliary tokens, prepended to the token axis and stripped before decoding -->
  <rect x="721" y="130" width="80" height="18" fill="#E7E5EE" stroke="#8E8A99" stroke-width="1"/>
  <text x="761" y="144" font-size="10" text-anchor="middle" fill="#4A4550">aux</text>

  <g stroke="#ffffff" stroke-width="1.5">
    <rect x="721" y="154" width="80" height="26" fill="#DFE4E9"/>
    <rect x="721" y="180" width="80" height="26" fill="#DFE4E9"/>
    <rect x="721" y="206" width="80" height="26" fill="#DFE4E9"/>
    <rect x="721" y="232" width="80" height="26" fill="#DFE4E9"/>
  </g>
  <rect x="721" y="154" width="80" height="104" fill="none" stroke="#5E6B78" stroke-width="1.8"/>

  <text x="711" y="206" font-size="10.5" text-anchor="middle" fill="#5A6068"
        transform="rotate(-90 711 206)">cells</text>
  <text x="761" y="278" font-size="11" text-anchor="middle" fill="#26313B">
    one query slice, Q = 1
  </text>
  <text x="761" y="294" font-size="10.5" text-anchor="middle" fill="#3A3F45">
    [B, (n_aux+N_cells)×Q, D]
  </text>
  <text x="761" y="308" font-size="9.5" font-style="italic" text-anchor="middle" fill="#5A6068">
    aux: register / class, optional
  </text>

  <line x1="858" y1="196" x2="882" y2="196" stroke="#5A6068" stroke-width="1.5"
        marker-end="url(#arrow)"/>

  <!-- the single forecasting engine -->
  <rect x="886" y="127" width="364" height="140" rx="6" fill="#DDE3EA" stroke="#5E6B78"/>
  <text x="1068" y="157" font-size="11" text-anchor="middle" fill="#5E6B78">
    Forecasting engine
  </text>
  <text x="1068" y="185" font-size="15" font-weight="bold" text-anchor="middle" fill="#26313B">
    single latent space
  </text>
  <text x="1068" y="210" font-size="12" text-anchor="middle" fill="#26313B">
    Δt = 6 h  ·  16 blocks  ·  16 heads
  </text>
  <text x="1068" y="234" font-size="11" font-style="italic" text-anchor="middle" fill="#5A6068">
    every token advances at the same cadence
  </text>

  <path d="M 1252 172 C 1264 172, 1266 140, 1276 140" fill="none" stroke="#5A6068"
        stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 1252 222 C 1264 222, 1266 258, 1276 258" fill="none" stroke="#5A6068"
        stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- per-stream decoders, one box per stream, both reading the whole latent -->
  <rect x="1280" y="88" width="200" height="104" rx="6" fill="#DDE3EA" stroke="#5E6B78"/>
  <text x="1380" y="114" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#26313B">
    ERA5 decoder
  </text>
  <text x="1380" y="136" font-size="12" text-anchor="middle" fill="#26313B">
    reads the whole latent
  </text>
  <text x="1380" y="158" font-size="11" text-anchor="middle" fill="#5A6068">
    1-ring HEALPix gather
  </text>
  <text x="1380" y="180" font-size="11" text-anchor="middle" fill="#5A6068">
    target coords → physical
  </text>

  <rect x="1280" y="206" width="200" height="104" rx="6" fill="#DDE3EA" stroke="#5E6B78"/>
  <text x="1380" y="232" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#26313B">
    C-GLORS decoder
  </text>
  <text x="1380" y="254" font-size="12" text-anchor="middle" fill="#26313B">
    reads the whole latent
  </text>
  <text x="1380" y="276" font-size="11" text-anchor="middle" fill="#5A6068">
    1-ring HEALPix gather
  </text>
  <text x="1380" y="298" font-size="11" text-anchor="middle" fill="#5A6068">
    target coords → physical
  </text>

  <text x="1380" y="330" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5A6068">
    both decoders read the same
  </text>
  <text x="1380" y="345" font-size="10.5" font-style="italic" text-anchor="middle" fill="#5A6068">
    tokens, with no restriction
  </text>

  <!-- rollout feedback loop -->
  <path d="M 1068 267 C 1068 366, 950 366, 880 366 C 820 366, 761 362, 761 318"
        fill="none" stroke="#5A6068" stroke-width="1.5" stroke-dasharray="5 4"
        marker-end="url(#arrow)"/>
  <text x="915" y="386" font-size="12" text-anchor="middle" fill="#5A6068">
    next rollout step
  </text>

  <!-- ============================ panel b ============================ -->
  <line x1="20" y1="412" x2="1480" y2="412" stroke="#DDE0E4" stroke-width="1"/>

  <text x="20" y="448" font-size="17" font-weight="bold" fill="#1A1A1A">b</text>
  <text x="44" y="448" font-size="17" fill="#1A1A1A">Rollout cadence</text>
  <text x="44" y="470" font-size="12.5" fill="#5A6068">
    base forecast step 6 h, offset 1 — the single engine advances the whole latent at every step
  </text>

  <!-- step axis -->
  <line x1="250" y1="514" x2="1200" y2="514" stroke="#C6CAD0" stroke-width="1"/>
  <g font-size="12" text-anchor="middle" fill="#3A3F45">
    <text x="350" y="504">step 1</text>
    <text x="570" y="504">step 2</text>
    <text x="790" y="504">step 3</text>
    <text x="1010" y="504">step 4</text>
  </g>
  <g font-size="11" text-anchor="middle" fill="#5A6068">
    <text x="350" y="532">+6 h</text>
    <text x="570" y="532">+12 h</text>
    <text x="790" y="532">+18 h</text>
    <text x="1010" y="532">+24 h</text>
  </g>

  <!-- the whole latent, one row -->
  <text x="235" y="580" font-size="12.5" text-anchor="end" fill="#26313B" font-weight="bold">
    latent (all dynamics)
  </text>
  <text x="235" y="597" font-size="11" text-anchor="end" fill="#5A6068">stride 1</text>
  <line x1="350" y1="576" x2="1010" y2="576" stroke="#5E6B78" stroke-width="1.8"/>
  <g fill="#5E6B78">
    <circle cx="350" cy="576" r="8"/>
    <circle cx="570" cy="576" r="8"/>
    <circle cx="790" cy="576" r="8"/>
    <circle cx="1010" cy="576" r="8"/>
  </g>
  <text x="1060" y="581" font-size="11" fill="#5A6068">engine applied, advances 6 h</text>

  <!-- per-stream decode rows -->
  <text x="235" y="638" font-size="12.5" text-anchor="end" fill="#6B5A34" font-weight="bold">
    ERA5
  </text>
  <text x="235" y="655" font-size="11" text-anchor="end" fill="#5A6068">decode, every step</text>
  <g fill="#A98B5D">
    <rect x="343" y="627" width="14" height="14" rx="2"/>
    <rect x="563" y="627" width="14" height="14" rx="2"/>
    <rect x="783" y="627" width="14" height="14" rx="2"/>
    <rect x="1003" y="627" width="14" height="14" rx="2"/>
  </g>

  <text x="235" y="696" font-size="12.5" text-anchor="end" fill="#6B5A34" font-weight="bold">
    C-GLORS
  </text>
  <text x="235" y="713" font-size="11" text-anchor="end" fill="#5A6068">decode, every step</text>
  <g fill="#A98B5D">
    <rect x="343" y="685" width="14" height="14" rx="2"/>
    <rect x="563" y="685" width="14" height="14" rx="2"/>
    <rect x="783" y="685" width="14" height="14" rx="2"/>
    <rect x="1003" y="685" width="14" height="14" rx="2"/>
  </g>

  <path d="M 1052 634 L 1044 634 L 1044 692 L 1052 692" fill="none" stroke="#C6CAD0"
        stroke-width="1"/>
  <text x="1060" y="658" font-size="11" fill="#5A6068">both streams read the same latent,</text>
  <text x="1060" y="674" font-size="11" fill="#5A6068">always at its valid time</text>

  <!-- closing note -->
  <text x="250" y="760" font-size="11.5" fill="#3A3F45">
    One engine and one Δt for every dynamic: a slow component is advanced at the atmospheric rate,
  </text>
  <text x="250" y="778" font-size="11.5" fill="#3A3F45">
    and nothing can advance more often than the base step — the constraint that latent groups lift.
  </text>
</svg>
